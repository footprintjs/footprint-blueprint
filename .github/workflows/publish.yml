name: Reviewed npm release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact reviewed release to npm
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: reviewed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify the pinned npm version and release guards
        run: |
          test "$(npm --version)" = 11.19.0
          node --test scripts/release/guards.test.mjs
      - name: Install the pinned package manager without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/release-tools" pnpm@12.11.2 --ignore-scripts --no-audit --no-fund
      - name: Install the frozen source graph
        run: '"$RUNNER_TEMP/release-tools/node_modules/@pnpm/exe.linux-x64/pnpm" install --frozen-lockfile --ignore-scripts'
      - name: Typecheck, test and build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Check the existing release contracts
        run: npm run test:release
      - name: Pack and check the reviewed immutable archive
        run: |
          mkdir -p release
          "$RUNNER_TEMP/release-tools/node_modules/@pnpm/exe.linux-x64/pnpm" --config.manage-package-manager-versions=false --config.verify-deps-before-run=false pack --pack-destination release
          mv release/footprint-blueprint-0.4.1.tgz release/package.tgz
          node scripts/release/run.mjs archive release/package.tgz
          git diff --exit-code
      - name: Check the registry immediately before an explicit publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: node scripts/release/run.mjs preflight release/package.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-package
          path: release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-package
          path: release
      - name: Publish only the reviewed archive using GitHub OIDC
        run: |
          test "$(npm --version)" = 11.19.0
          node scripts/release/run.mjs publish release/package.tgz
